apply plugin: 'com.android.application'

android {
    namespace 'com.divinefreeze.app'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.divinefreeze.app"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
